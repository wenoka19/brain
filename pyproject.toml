[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain"
version = "0.1.0"
description = "Personal knowledge & procedural skills MCP server"
requires-python = ">=3.11"
# The single source of truth for dependencies. `.claude/setup.sh` and the
# `Dockerfile` READ this list; neither restates it. Three lists used to exist and
# two had drifted — `mcp` and `yt-dlp` were declared only in the image, so
# `pip install .` produced an app that could not import itself.
dependencies = [
  "rapidfuzz>=3.9",
  "sqlite-vec>=0.1.6",
  "fastapi>=0.110",
  # `[standard]` carries the httptools/uvloop/websockets extras the image was
  # already installing. Declaring plain `uvicorn` here while the Dockerfile
  # installed `uvicorn[standard]` meant a local run and a deployed run did not
  # use the same HTTP stack.
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-multipart>=0.0.9",
  # `app/mcp_server.py` imports `mcp.server.mcpserver.MCPServer` and
  # `mcp.server.transport_security`, module paths that exist only in 2.x. The
  # image asked for `mcp>=1.2`, so a fresh build was free to resolve 1.x and
  # fail at import after a green build. Verified against 2.3.0.
  "mcp>=2.3,<3",
  # Invoked as a PATH executable by `app/ingestion/fetchers.py`, never imported,
  # which is why its absence showed up as a `cli doctor` warning rather than an
  # ImportError. The wheel installs the console script.
  #
  # The two extras are not optional, and neither is the floor. yt-dlp cannot
  # read YouTube without a JavaScript runtime and the EJS challenge-solver
  # scripts, and it is the authority on which versions of each it will accept:
  #   * `deno`    -> `deno>=2.9.8`, the Deno authors' own PyPI redistribution
  #                  (support@deno.com, MIT, wheels for manylinux x86_64 and
  #                  aarch64), which pip resolves to the right architecture.
  #                  The image used to curl a hardcoded `deno-2.1.4` zip after
  #                  reading `dpkg --print-architecture` by hand: that binary
  #                  ran, printed its version, satisfied `doctor`, and was
  #                  below yt-dlp's minimum of 2.3.0, so every video failed.
  #                  Delegating the version to the only project that knows it
  #                  removes both the arithmetic and the arch detection.
  #   * `default` -> `yt-dlp-ejs==0.8.0`, pinned by yt-dlp to the script
  #                  version its own wheel vendors. The wheel ships the
  #                  solver's core script but not its lib script, so without
  #                  this package yt-dlp's only remaining sources are an NPM or
  #                  GitHub download it refuses unless `--remote-components`
  #                  allows it. Pinning that version here instead would be a
  #                  second copy of someone else's constraint, drifting the
  #                  moment they bump it.
  # yt-dlp's `deno` extra does not exist in older releases, where pip would
  # ignore the name with a warning, so the floor moves with it.
  "yt-dlp[default,deno]>=2026.10.26",
  # Declared without a floor on purpose. `app/ingestion/fetchers.py` imports
  # this package directly — `find_deno_bin()` knows where pip put the binary,
  # which is strictly more than yt-dlp's own discovery looks at — and the rule
  # this file enforces is that a direct import is declared. The *version* is
  # yt-dlp's business: its `deno` extra above asks for >= 2.9.8, and pip
  # resolves both constraints together. Repeating that number here would be a
  # second copy of someone else's decision, drifting the moment they bump it.
  "deno",
  # Both of these arrive transitively through FastAPI, and `app/` imports them
  # DIRECTLY — `starlette.responses`/`requests`/`middleware.base`/`routing`/
  # `exceptions`/`testclient` across the control plane, and `pydantic.AnyHttpUrl`
  # in the MCP server. An undeclared direct import works only for as long as
  # someone else's dependency keeps supplying it.
  "starlette>=0.36",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# `PyYAML` and `reportlab` were imported by the test suite and declared nowhere:
# the suite only ran on hosts that happened to have them, which is why a fresh
# Cloud VM could run `.claude/setup.sh` successfully and still fail to collect.
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "PyYAML>=6.0",
  "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
