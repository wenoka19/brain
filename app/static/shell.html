<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Brain</title>
<!-- Layer order is the build order (§0 rule 2): tokens, atoms, molecules,
     frames. A later sheet may only compose what an earlier one declared. -->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/atoms.css">
<link rel="stylesheet" href="/molecules.css">
<link rel="stylesheet" href="/frames.css">
</head>
<!-- The new surface is served under a prefix while the shipped control plane
     still owns `/`. The router adds it to every link and strips it before
     matching, so a deep link survives a hard reload today and at cutover this
     becomes `data-base=""` — one attribute, nothing else. -->
<body data-base="/next">

<!-- The icon set. Inline symbols only: nothing is fetched, so the strict CSP
     holds and no glyph can render as a missing-character box. Every one is a
     16px stroke drawing sized by §3.1's slot, never by its own width. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" class="sprite">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></symbol>
  <symbol id="i-transcripts" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6"/><path d="M9 16h6"/></symbol>
  <symbol id="i-summaries" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 11h12"/><path d="M4 16h16"/><path d="M4 21h8"/></symbol>
  <symbol id="i-sources" viewBox="0 0 24 24"><path d="M10 14a4 4 0 006 .5l2-2a4 4 0 00-5.7-5.7L11 8"/><path d="M14 10a4 4 0 00-6-.5l-2 2a4 4 0 005.7 5.7L13 16"/></symbol>
  <symbol id="i-rules" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></symbol>
  <symbol id="i-skills" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-connections" viewBox="0 0 24 24"><path d="M9 3v6"/><path d="M15 3v6"/><path d="M7 9h10v3a5 5 0 01-10 0z"/><path d="M12 17v4"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M3 5h18v4H3z"/><path d="M5 9v11h14V9"/><path d="M10 13h4"/></symbol>
  <symbol id="i-profile" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a2 2 0 00-2 2v9"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M14 6l4 4"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 10a8 8 0 112 6"/><path d="M3 5v5h5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M7 12h10"/><path d="M10 17h4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M10 10l5 2-5 2z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-agent" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4"/><circle cx="9" cy="13.5" r="1.1"/><circle cx="15" cy="13.5" r="1.1"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M15.5 6.5a5 5 0 10-7 7 5 5 0 107-7z"/><path d="M12 3v3"/><path d="M12 18v3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
</svg>

<!-- ======================= §5 THE TEMPLATE =============================== -->
<div class="shell">

  <!-- The top bar exists only below 720px (§12), where the sidebar folds away
       and there is no hover to reveal anything. -->
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false">
      <svg class="icon"><use href="#i-menu"/></svg>
    </button>
    <span class="brand"><span class="brand-mark"></span><span>Brain</span></span>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Sections">
    <!-- The brand mark sits in the same 20px slot as every nav icon and the
         avatar below it. That is §3.1's whole point: one vertical axis from
         the logo to the profile row. -->
    <a class="brand" href="/">
      <span class="slot"><span class="brand-mark"></span></span>
      <span>Brain</span>
    </a>

    <hr class="divider brand-rule">

    <a class="nav-item" href="/" data-route="/">
      <span class="slot"><svg class="icon"><use href="#i-home"/></svg></span>
      <span class="nav-label">Home</span>
    </a>

    <p class="nav-section">Library</p>
    <a class="nav-item" href="/library/transcripts" data-route="/library/transcripts">
      <span class="slot"><svg class="icon"><use href="#i-transcripts"/></svg></span>
      <span class="nav-label">Transcripts</span>
      <span class="nav-count" data-count="transcripts"></span>
    </a>
    <a class="nav-item" href="/library/summaries" data-route="/library/summaries">
      <span class="slot"><svg class="icon"><use href="#i-summaries"/></svg></span>
      <span class="nav-label">Summaries</span>
      <span class="nav-count" data-count="summaries"></span>
    </a>
    <a class="nav-item" href="/library/sources" data-route="/library/sources">
      <span class="slot"><svg class="icon"><use href="#i-sources"/></svg></span>
      <span class="nav-label">Sources</span>
      <span class="nav-count" data-count="sources"></span>
    </a>

    <p class="nav-section">Knowledge</p>
    <a class="nav-item" href="/rules" data-route="/rules">
      <span class="slot"><svg class="icon"><use href="#i-rules"/></svg></span>
      <span class="nav-label">Rules</span>
      <span class="nav-count" data-count="rules"></span>
    </a>
    <a class="nav-item" href="/skills" data-route="/skills">
      <span class="slot"><svg class="icon"><use href="#i-skills"/></svg></span>
      <span class="nav-label">Skills</span>
      <span class="nav-count" data-count="skills"></span>
    </a>

    <p class="nav-section">System</p>
    <a class="nav-item" href="/activity" data-route="/activity">
      <span class="slot"><svg class="icon"><use href="#i-activity"/></svg></span>
      <span class="nav-label">Activity</span>
    </a>
    <a class="nav-item" href="/connections" data-route="/connections">
      <span class="slot"><svg class="icon"><use href="#i-connections"/></svg></span>
      <span class="nav-label">Connections</span>
    </a>
    <a class="nav-item" href="/archive" data-route="/archive">
      <span class="slot"><svg class="icon"><use href="#i-archive"/></svg></span>
      <span class="nav-label">Archive</span>
      <span class="nav-count" data-count="archive"></span>
    </a>

    <!-- margin-top:auto (§5) -->
    <div class="sidebar-foot">
      <hr class="divider">
      <a class="nav-item" href="/profile" data-route="/profile">
        <span class="slot"><span class="avatar" data-initial="E">E</span></span>
        <span class="nav-label">Profile</span>
      </a>
    </div>
  </nav>

  <!-- The scrim that closes the folded navigation on a phone. -->
  <div class="nav-scrim" id="nav-scrim" hidden></div>

  <main class="content" id="content" tabindex="-1">
    <!-- Every frame renders here. The router owns this node and nothing else. -->
  </main>
</div>

<!-- Live region for the things a screen reader must hear but nobody draws:
     a route change, a toast, a step completing. -->
<p class="sr-only" id="announcer" role="status" aria-live="polite"></p>

<div class="toast" id="toast" hidden></div>

<script src="/frames.js" type="module"></script>
</body>
</html>
